name: Build SciPy for Android ARM64

on:
  workflow_dispatch:
    inputs:
      scipy_version:
        description: "SciPy version"
        required: true
        default: "1.17.1"

      android_api:
        description: "Android API level"
        required: true
        default: "24"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      PYTHON_VERSION: "3.13"
      ANDROID_API: ${{ inputs.android_api || '24' }}
      SCIPY_VERSION: ${{ inputs.scipy_version || '1.17.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            cmake \
            ninja-build \
            pkg-config \
            gfortran \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libopenblas-dev \
            liblapack-dev

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK package
        run: |
          sdkmanager "ndk;27.2.12479018"

          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Download CPython 3.13 source
        run: |
          wget -q \
            https://www.python.org/ftp/python/${PYTHON_VERSION}.0/Python-${PYTHON_VERSION}.0.tgz

          tar xf Python-${PYTHON_VERSION}.0.tgz

      - name: Build CPython host
        working-directory: Python-${{ env.PYTHON_VERSION }}.0
        run: |
          ./configure \
            --prefix="$HOME/python-host"

          make -j"$(nproc)"
          make install

      - name: Create Python 3.13 build environment
        run: |
          "$HOME/python-host/bin/python3" -m venv "$HOME/build-venv"

          "$HOME/build-venv/bin/python" -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel \
            meson \
            meson-python \
            ninja \
            Cython \
            pybind11 \
            pythran

      - name: Clone SciPy
        run: |
          git clone \
            --depth 1 \
            --branch "v${SCIPY_VERSION}" \
            https://github.com/scipy/scipy.git

      - name: Configure Android toolchain
        run: |
          export NDK="$ANDROID_NDK"

          echo "CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android
