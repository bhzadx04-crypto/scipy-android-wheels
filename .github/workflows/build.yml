name: Build SciPy Android ARM64

on:
  workflow_dispatch:
    inputs:
      scipy_version:
        description: "SciPy version"
        required: true
        default: "1.17.1"

      android_api:
        description: "Android API level"
        required: true
        default: "24"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      SCIPY_VERSION: ${{ inputs.scipy_version || '1.17.1' }}
      ANDROID_API: ${{ inputs.android_api || '24' }}
      NDK_VERSION: "27.2.12479018"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Android SDK / NDK
      # --------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          set -eux

          sdkmanager "ndk;${NDK_VERSION}"

          NDK="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"

          test -d "$NDK"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # System dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            ninja-build \
            cmake \
            pkg-config \
            gfortran \
            python3 \
            python3-dev \
            python3-venv \
            libopenblas-dev \
            liblapack-dev

      # --------------------------------------------------
      # uv
      # --------------------------------------------------

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      # --------------------------------------------------
      # Python 3.13
      # --------------------------------------------------

      - name: Setup Python 3.13
        run: |
          set -eux

          uv python install 3.13

          uv venv \
            --python 3.13 \
            "$RUNNER_TEMP/venv"

          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

          python --version

      # --------------------------------------------------
      # Python build dependencies
      # --------------------------------------------------

      - name: Install Python dependencies
        run: |
          set -eux

          uv pip install \
            --python "$RUNNER_TEMP/venv/bin/python" \
            -U \
            pip \
            setuptools \
            wheel \
            meson \
            meson-python \
            ninja \
            Cython \
            pybind11 \
            pythran

      # --------------------------------------------------
      # SciPy
      # --------------------------------------------------

      - name: Clone SciPy
        run: |
          set -eux

          git clone \
            --depth 1 \
            --branch "v${SCIPY_VERSION}" \
            https://github.com/scipy/scipy.git

          cd scipy

          git rev-parse HEAD

      # --------------------------------------------------
      # Android toolchain
      # --------------------------------------------------

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================"
          echo "Android configuration"
          echo "================================"

          echo "SDK:  $ANDROID_SDK_ROOT"
          echo "NDK:  $ANDROID_NDK"
          echo "API:  $ANDROID_API"

          TOOLCHAIN="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$TOOLCHAIN"

          echo
          echo "Toolchain:"
          ls -la "$TOOLCHAIN" | head -50

          CC="$TOOLCHAIN/clang"
          CXX="$TOOLCHAIN/clang++"
          AR="$TOOLCHAIN/llvm-ar"
          RANLIB="$TOOLCHAIN/llvm-ranlib"
          STRIP="$TOOLCHAIN/llvm-strip"

          test -x "$CC"
          test -x "$CXX"
          test -x "$AR"
          test -x "$RANLIB"
          test -x "$STRIP"

          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
          echo "AR=$AR" >> "$GITHUB_ENV"
          echo "RANLIB=$RANLIB" >> "$GITHUB_ENV"
          echo "STRIP=$STRIP" >> "$GITHUB_ENV"

          echo "ANDROID_TARGET=aarch64-linux-android" >> "$GITHUB_ENV"

          echo
          echo "Compiler:"
          "$CC" \
            --target="aarch64-linux-android${ANDROID_API}" \
            --version

          "$CXX" \
            --target="aarch64-linux-android${ANDROID_API}" \
            --version

      # --------------------------------------------------
      # Test Android compiler
      # --------------------------------------------------

      - name: Test Android compiler
        shell: bash
        run: |
          set -euxo pipefail

          cat > "$RUNNER_TEMP/test.c" <<'EOF'
          int main(void) {
              return 0;
          }
          EOF

          "$CC" \
            --target="aarch64-linux-android${ANDROID_API}" \
            "$RUNNER_TEMP/test.c" \
            -o "$RUNNER_TEMP/test"

          file "$RUNNER_TEMP/test"

      # --------------------------------------------------
      # Meson cross file
      # --------------------------------------------------

      - name: Create
