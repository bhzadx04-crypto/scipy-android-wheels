name: Build SciPy Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      SCIPY_VERSION: "1.17.1"
      ANDROID_API: "24"
      NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -eux

          sdkmanager "ndk;${NDK_VERSION}"

          NDK="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"

          test -d "$NDK"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

      - name: Install system dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            ninja-build \
            cmake \
            pkg-config \
            gfortran

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python 3.13
        shell: bash
        run: |
          set -eux

          uv python install 3.13

          uv venv \
            --python 3.13 \
            "$RUNNER_TEMP/venv"

          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/venv/bin/python" --version

      - name: Install Python build dependencies
        shell: bash
        run: |
          set -eux

          uv pip install \
            --python "$RUNNER_TEMP/venv/bin/python" \
            pip \
            setuptools \
            wheel \
            meson \
            meson-python \
            ninja \
            Cython \
            pybind11 \
            pythran

      - name: Clone SciPy
        shell: bash
        run: |
          set -eux

          git clone \
            --depth 1 \
            --branch "v${SCIPY_VERSION}" \
            https://github.com/scipy/scipy.git

          cd scipy

          git submodule update --init --recursive

          echo "=== Submodules ==="
          git submodule status

          test -d subprojects/xsf

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$TOOLCHAIN"

          CC="$TOOLCHAIN/clang"
          CXX="$TOOLCHAIN/clang++"

          test -x "$CC"
          test -x "$CXX"

          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/llvm-strip" >> "$GITHUB_ENV"

          echo "ANDROID_TARGET=aarch64-linux-android" >> "$GITHUB_ENV"

          "$CC" \
            --target="aarch64-linux-android${ANDROID_API}" \
            --version

          "$CXX" \
            --target="aarch64-linux-android${ANDROID_API}" \
            --version

      - name: Test Android compiler
        shell: bash
        run: |
          set -eux

          cat > "$RUNNER_TEMP/test.c" <<'EOF'
          int main(void) {
              return 0;
          }
          EOF

          "$CC" \
            --target="aarch64-linux-android${ANDROID_API}" \
            "$RUNNER_TEMP/test.c" \
            -o "$RUNNER_TEMP/test"

          file "$RUNNER_TEMP/test"

      - name: Create Meson cross file
        shell: bash
        run: |
          set -eux

          TOOLCHAIN="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          cat > "$RUNNER_TEMP/android-aarch64.ini" <<EOF
          [binaries]
          c = '$TOOLCHAIN/clang'
          cpp = '$TOOLCHAIN/clang++'
          ar = '$TOOLCHAIN/llvm-ar'
          strip = '$TOOLCHAIN/llvm-strip'
          ranlib = '$TOOLCHAIN/llvm-ranlib'

          [built-in options]
          c_args = ['--target=aarch64-linux-android${ANDROID_API}']
          cpp_args = ['--target=aarch64-linux-android${ANDROID_API}']

          c_link_args = ['--target=aarch64-linux-android${ANDROID_API}']
          cpp_link_args = ['--target=aarch64-linux-android${ANDROID_API}']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          EOF

          cat "$RUNNER_TEMP/android-aarch64.ini"

      - name: Build SciPy wheel
        working-directory: scipy
        shell: bash
        env:
          MESON_ARGS: "--cross-file $RUNNER_TEMP/android-aarch64.ini"
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/wheelhouse"

          python -m pip wheel \
            . \
            --no-deps \
            --wheel-dir "$GITHUB_WORKSPACE/wheelhouse" \
            --config-settings=setup-args="--cross-file=$RUNNER_TEMP/android-aarch64.ini" \
            -v

      - name: Inspect wheel
        shell: bash
        run: |
          set -eux

          ls -lah wheelhouse

          WHEEL="$(find wheelhouse -name '*.whl' -type f | head -n 1)"

          test -n "$WHEEL"

          echo "================================"
          echo "Wheel:"
          echo "$WHEEL"
          echo "================================"

          echo
          echo "WHEEL metadata:"
          unzip -p "$WHEEL" '*/WHEEL' || true

          echo
          echo "Native libraries:"
          mkdir -p "$RUNNER_TEMP/wheel-check"

          unzip -q "$WHEEL" \
            -d "$RUNNER_TEMP/wheel-check"

          find "$RUNNER_TEMP/wheel-check" \
            -type f \
            -name "*.so" \
            -exec file {} \; || true

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: scipy-${{ env.SCIPY_VERSION }}-cp313-android-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
